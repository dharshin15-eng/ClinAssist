# ClinAssist Application Configuration
spring.application.name=ClinAssist
server.port=8080

# MongoDB Configuration (Externalized credentials)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/clinassist}

# JWT Configuration (Secret comes strictly from environment variable, no hardcoded fallback)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Gemini API Configuration (Externalized credentials)
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:10000}

# Diagnostic Report File Upload Configuration
clinassist.reports.max-file-size-bytes=${MAX_REPORT_FILE_SIZE:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


