# ==============================================================================
# ClinAssist Render Blueprint Configuration
# Deploys the Spring Boot 3 Backend as a Docker Web Service and the
# React 18 + Vite Frontend as a Static Site.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  - type: web
    name: clinassist-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_MS
        value: 30000
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: static
    name: clinassist-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
