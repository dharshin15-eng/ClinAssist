# ClinAssist Application Configuration
spring.application.name=ClinAssist
server.port=${PORT:8080}

# CORS Configuration (Allowed frontend origins for production and local development)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# MongoDB Configuration (Externalized credentials)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/clinassist}

# JWT Configuration (Secret comes from environment variable with safe default fallback for local dev)
jwt.secret=${JWT_SECRET:ClinAssistSecretKeyForJWTAuthTokenGeneration2026!ClinAssistSecretKeyForJWTAuthTokenGeneration2026!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Gemini API Configuration (Externalized credentials)
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}

# Diagnostic Report File Upload Configuration
clinassist.reports.max-file-size-bytes=${MAX_REPORT_FILE_SIZE:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


